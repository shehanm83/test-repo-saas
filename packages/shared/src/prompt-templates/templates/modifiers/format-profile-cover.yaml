id: modifier.format_profile_cover
name: Profile Or Cover Format Modifier
category: modifier
version: 1
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - profile
  - cover
variables:
  required:
    - output.platform_label
    - output.width
    - output.height
    - output.aspect_ratio
  optional: []
safety_rules:
  - Avoid exact readable text in profile and cover backgrounds.
overlay_contract:
  renderer_owns:
    - logo
    - exact_text
  model_owns:
    - profile_cover_background
prompt: |
  Profile and cover guidance:
  Build for {{output.platform_label}} at {{output.width}} x {{output.height}} ({{output.aspect_ratio}}).
  Keep the result clean, recognizable, and resilient to circular profile crops or cover overlays.
negative_prompt: |
  tiny details, important edge content, readable text, fake logo
