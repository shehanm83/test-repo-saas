id: quick.product_only
# RESPONSIBILITY: clean reusable product asset — single product, neutral
# background, no advertising context. The user picked a product and no
# campaign details, so they want a CATALOG-grade asset for later reuse,
# not a finished ad. Don't add scene drama, action, or overlay space.
name: Quick Create Product Only
category: image_generation
version: 2
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - product
  - asset
variables:
  required:
    - brief
    - product_summary
    - output.format
    - output.aspect_ratio
  optional:
    - brand_summary
    - mood_summary
    - composition_summary
safety_rules:
  - Do not alter protected product identity, packaging shape, or visible label structure.
  - Do not invent readable label text or claims when no brand artwork was provided.
  - Do not generate readable promotional text, QR codes, URLs, phone numbers, or logos.
overlay_contract:
  renderer_owns: []
  model_owns:
    - product_context
    - background
    - lighting
    - reflections
    - shadows
  safe_zone_instruction: No overlay space required — this is a clean asset for downstream reuse.
expected_output:
  type: image
prompt: |
  Create a clean, reusable product photograph at {{output.platform_label}}.
  This is a CATALOG ASSET — a clean product shot for later reuse, not a finished
  ad. Do not add advertising styling, environmental storytelling, or marketing
  language.

  User direction:
  {{brief}}

  Product context:
  {{product_summary}}

  {{reference_summary}}

  Visual direction:
  {{composition_summary}}

  {{brand_summary}}
  {{mood_summary}}

  Centered, isolated product on a neutral / studio background. Clean studio
  lighting. Realistic surface texture. Preserve the product's original silhouette
  and proportions. No text, no overlays, no scene elements, no environmental props,
  no headline space, no campaign layout, no marketing composition.
  Suitable for downstream reuse in ads, catalogs, or compositions.
negative_prompt: |
  distorted product, warped packaging, unreadable label text, fake label claims,
  random price text, fake logo, fake QR code, watermark, cluttered background,
  advertising layout, headline space, marketing copy, scene elements,
  athletes, action shots, splash effects, environmental drama
