id: quick.product_campaign
# RESPONSIBILITY: ad COMPOSITE — product placed in a campaign scene with
# overlay space for headline/CTA. Three responsibilities are intentionally
# combined here because the user has both products AND campaign details;
# the other 3 quick-mode YAMLs handle the cleaner subsets.
name: Quick Create Product Campaign
category: image_generation
version: 2
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - product
  - campaign
variables:
  required:
    - brief
    - product_summary
    - campaign_summary
    - output.format
    - output.aspect_ratio
  optional:
    - brand_summary
    - mood_summary
    - composition_summary
    - overlay_summary
safety_rules:
  - Do not alter protected product identity, packaging shape, or visible label structure.
  - Do not generate exact readable campaign text; renderer overlays exact copy.
  - Do not invent prices, discounts, legal text, URLs, phone numbers, QR codes, or logos.
overlay_contract:
  renderer_owns:
    - logo
    - headline
    - subtitle
    - price
    - discount
    - badge
    - cta
    - legal_text
    - website
    - phone
    - qr_code
  model_owns:
    - product_context
    - background_scene
    - lighting
    - visual_mood
    - decorative_non_text_elements
  safe_zone_instruction: Leave intentional clean space for campaign overlays without covering the product.
expected_output:
  type: image
prompt: |
  Create a product CAMPAIGN COMPOSITE at {{output.platform_label}} — a finished
  ad-style image that combines: (1) the user's product, (2) a scene that
  matches the campaign mood, and (3) intentional quiet space for the renderer
  to overlay headline / offer / CTA / logo on top.

  User direction:
  {{brief}}

  Product context (do not invent unspecified products or branding):
  {{product_summary}}

  Campaign context:
  {{campaign_summary}}

  Visual direction:
  {{composition_summary}}

  {{brand_summary}}
  {{mood_summary}}
  {{overlay_summary}}

  Compose the product at a believable scale within the scene. Reserve clean,
  low-detail overlay space for headline, offer, CTA, logo, and legal details
  (typically one side or one corner — not across the product).
  Do NOT render readable campaign text, prices, QR codes, URLs, phone numbers,
  or logos inside the image.
negative_prompt: |
  distorted product, warped packaging, unreadable label text, fake CTA, fake price,
  fake QR code, fake URL, fake phone number, fake logo, watermark, cluttered layout
