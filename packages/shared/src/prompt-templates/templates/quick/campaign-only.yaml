id: quick.campaign_only
name: Quick Create Campaign Only
category: image_generation
version: 1
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - campaign
variables:
  required:
    - brief
    - campaign_summary
    - output.format
    - output.aspect_ratio
  optional:
    - brand_summary
    - mood_summary
    - composition_summary
    - overlay_summary
safety_rules:
  - Do not generate exact readable campaign text; renderer overlays exact copy.
  - Do not invent prices, discounts, legal text, URLs, phone numbers, QR codes, or logos.
  - Do not create misleading claims beyond the provided campaign context.
overlay_contract:
  renderer_owns:
    - logo
    - headline
    - subtitle
    - price
    - discount
    - badge
    - cta
    - legal_text
    - website
    - phone
    - qr_code
  model_owns:
    - background_scene
    - visual_mood
    - campaign_context
    - decorative_non_text_elements
  safe_zone_instruction: Leave intentional clean space for campaign overlays.
expected_output:
  type: image
prompt: |
  Create a polished campaign image for {{output.platform_label}}.

  User direction:
  {{brief}}

  Campaign context:
  {{campaign_summary}}

  Visual direction:
  {{composition_summary}}

  {{brand_summary}}
  {{mood_summary}}
  {{overlay_summary}}

  Leave intentional clean, low-detail space for headline, offer, CTA, logo, and legal overlays.
  Keep the main visual subject fully inside the frame with all edges visible; zoom out rather than crop.
  Do not render readable campaign text, prices, QR codes, URLs, phone numbers, or logos inside the image.
negative_prompt: |
  misspelled text, unreadable text, fake CTA, fake price, fake QR code, fake URL,
  fake phone number, fake logo, watermark, cluttered copy space,
  cropped main subject, subject cut off, out-of-frame subject
