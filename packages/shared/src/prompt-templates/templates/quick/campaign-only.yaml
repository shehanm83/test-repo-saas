id: quick.campaign_only
# RESPONSIBILITY: campaign SCENE — atmospheric environment for a campaign
# message, no specific product. Reserve overlay space because the renderer
# layers the actual headline/CTA/price text on top.
name: Quick Create Campaign Only
category: image_generation
version: 2
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - campaign
variables:
  required:
    - brief
    - campaign_summary
    - output.format
    - output.aspect_ratio
  optional:
    - brand_summary
    - mood_summary
    - composition_summary
    - overlay_summary
safety_rules:
  - Do not generate exact readable campaign text; renderer overlays exact copy.
  - Do not invent prices, discounts, legal text, URLs, phone numbers, QR codes, or logos.
  - Do not create misleading claims beyond the provided campaign context.
overlay_contract:
  renderer_owns:
    - logo
    - headline
    - subtitle
    - price
    - discount
    - badge
    - cta
    - legal_text
    - website
    - phone
    - qr_code
  model_owns:
    - background_scene
    - visual_mood
    - campaign_context
    - decorative_non_text_elements
  safe_zone_instruction: Leave intentional clean space for campaign overlays.
expected_output:
  type: image
prompt: |
  Create a campaign SCENE image at {{output.platform_label}}.
  This is the BACKDROP for a campaign — atmosphere and mood, not a finished ad.
  No specific product is featured. The renderer adds headline / CTA / price
  text on top, so leave intentional quiet areas for those overlays.

  User direction:
  {{brief}}

  Campaign context:
  {{campaign_summary}}

  Visual direction:
  {{composition_summary}}

  {{brand_summary}}
  {{mood_summary}}
  {{overlay_summary}}

  Leave clean, low-detail space (typically one side or one corner) for
  headline, offer, CTA, logo, and legal overlays.
  Do NOT render readable campaign text, prices, QR codes, URLs, phone numbers,
  or logos inside the image.
negative_prompt: |
  misspelled text, unreadable text, fake CTA, fake price, fake QR code, fake URL,
  fake phone number, fake logo, watermark, cluttered copy space
