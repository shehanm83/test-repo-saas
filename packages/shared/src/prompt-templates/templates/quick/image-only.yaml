id: quick.image_only
# RESPONSIBILITY: a generic image — neither a product asset nor a campaign
# scene. The user gave only a brief; we render that brief as a single
# polished frame. No advertising language, no overlay reservation by
# default unless the user requested overlay slots.
name: Quick Create Image Only
category: image_generation
version: 2
compatible_models:
  - gpt-image-1
  - flux-1.1-pro
  - recraft-v3
temperature: null
tags:
  - quick_create
  - image_only
variables:
  required:
    - brief
    - output.format
    - output.aspect_ratio
  optional:
    - brand_summary
    - mood_summary
    - composition_summary
    - overlay_summary
safety_rules:
  - Do not generate misleading medical, legal, or financial claims.
  - Do not invent certifications, awards, guarantees, prices, or claims.
  - Do not generate readable text, QR codes, URLs, phone numbers, or logos inside the image.
  - Use original characters and scenes; do not recreate named copyrighted characters.
overlay_contract:
  renderer_owns:
    - logo
    - headline
    - cta
    - legal_text
  model_owns:
    - background_scene
    - lighting
    - visual_mood
    - composition
  safe_zone_instruction: Leave clean, low-detail space if overlay slots are requested.
expected_output:
  type: image
  schema:
    prompt: string
    negative_prompt: string
    overlay_slots: object
prompt: |
  Generate a single image at {{output.platform_label}} based on the user's brief.
  This is a STANDALONE IMAGE — render the brief literally. Do not add
  advertising styling, headline space, or product-catalog framing unless
  the user explicitly asked for it.

  User direction:
  {{brief}}

  Visual direction:
  {{composition_summary}}

  {{brand_summary}}
  {{mood_summary}}
  {{overlay_summary}}

  Make the composition clean and production-ready at the requested output size.
  Do not render readable text, prices, QR codes, URLs, phone numbers, or logos.
  Use original character designs; do not recreate named copyrighted characters.
negative_prompt: |
  misspelled text, unreadable text, fake logo, fake QR code, random pricing,
  watermark, UI screenshot, distorted objects, cluttered composition,
  copyrighted character, named superhero, movie character likeness
